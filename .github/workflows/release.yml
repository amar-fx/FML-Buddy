name: Release FML Buddy (OTA)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Extension
        run: npm run build

      - name: Package ZXP Extension
        run: node scripts/build-zxp.js

      - name: Verify ZXP Output
        run: |
          ls -lh "FML Buddy.zxp"
          test -f "FML Buddy.zxp"

      - name: Create GitHub Release and Upload ZXP Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FML Buddy.zxp
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
